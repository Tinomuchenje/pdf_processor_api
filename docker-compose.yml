version: '3.8'

services:
  pdf-processor-api:
    build: .
    container_name: pdf-processor-api
    ports:
      - "5001:5001"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.0-flash-exp:free}
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
    volumes:
      - ./uploads:/usr/src/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/hc"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

